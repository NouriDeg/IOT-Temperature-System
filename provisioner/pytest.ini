# pytest.ini für Provisioner Tests
[pytest]
testpaths = tests

markers =
    unit: Unit tests (schnell, keine externen Abhängigkeiten)
    integration: Integration tests (benötigt laufende Services)
    slow: Langsame Tests

addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -m "not integration and not e2e"