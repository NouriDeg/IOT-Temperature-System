<!DOCTYPE html>
<html>
<head>
    <title>IoT Dashboard - Berlin Zeit</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a2e; color: white; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: #16213e; padding: 20px; border-radius: 10px; margin: 10px; }
        .temp-big { font-size: 48px; font-weight: bold; color: #e94560; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        canvas { max-height: 400px; width: 100%; }
        .device-list { max-height: 200px; overflow-y: auto; }
        .online { color: #4CAF50; }
        .offline { color: #f44336; }
        .timestamp { color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌡️ IoT Temperature Monitoring System</h1>
        <p class="timestamp">Zeitzone: Europe/Berlin (CET/CEST)</p>
        
        <div class="grid">
            <div class="card">
                <h3>Aktuelle Temperatur</h3>
                <div class="temp-big" id="current-temp">--.- °C</div>
                <div id="current-device"></div>
                <div id="current-time" class="timestamp"></div>
            </div>
            <div class="card">
                <h3>Statistik (letzte 24h)</h3>
                <div>Min: <span id="min-temp">--</span> °C</div>
                <div>Max: <span id="max-temp">--</span> °C</div>
                <div>Durchschnitt: <span id="avg-temp">--</span> °C</div>
                <div>Messungen: <span id="count">--</span></div>
            </div>
            <div class="card">
                <h3>Geräte Status</h3>
                <div class="device-list" id="devices-list">Wird geladen...</div>
            </div>
        </div>
        
        <div class="card">
            <h3>Temperaturverlauf (letzte 24h)</h3>
            <canvas id="tempChart"></canvas>
        </div>
    </div>

    <script>
        let chart;
        
        async function fetchLatest() {
            try {
                const res = await fetch('/api/latest');
                const data = await res.json();
                if (!data.error) {
                    document.getElementById('current-temp').innerHTML = data.temperature + ' °C';
                    document.getElementById('current-device').innerHTML = 'Gerät: ' + data.device_id;
                    document.getElementById('current-time').innerHTML = 'Letzte Messung: ' + data.timestamp;
                }
            } catch (error) {
                console.error('Fehler:', error);
            }
        }
        
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats?hours=24');
                const data = await res.json();
                if (!data.error) {
                    document.getElementById('min-temp').innerHTML = data.min_temp?.toFixed(2) || '--';
                    document.getElementById('max-temp').innerHTML = data.max_temp?.toFixed(2) || '--';
                    document.getElementById('avg-temp').innerHTML = data.avg_temp?.toFixed(2) || '--';
                    document.getElementById('count').innerHTML = data.count || 0;
                }
            } catch (error) {
                console.error('Fehler:', error);
            }
        }
        
        async function fetchDevices() {
            try {
                const res = await fetch('/api/devices');
                const data = await res.json();
                if (!data.error && data.length > 0) {
                    let html = '';
                    data.forEach(d => {
                        const statusClass = d.status === 'online' ? 'online' : 'offline';
                        html += `<div>
                            <strong>${d.device_id}</strong><br>
                            Status: <span class="${statusClass}">${d.status}</span><br>
                            Letzte Nachricht: ${d.last_seen || 'never'}
                        </div><hr>`;
                    });
                    document.getElementById('devices-list').innerHTML = html;
                } else {
                    document.getElementById('devices-list').innerHTML = 'Keine Geräte gefunden';
                }
            } catch (error) {
                console.error('Fehler:', error);
            }
        }
        
        async function fetchHistory() {
            try {
                const res = await fetch('/api/history?hours=24&limit=200');
                const data = await res.json();
                if (!data.error && data.length > 0) {
                    const times = data.map(d => {
                        const parts = d.timestamp.split(' ');
                        return parts[1]; // Nur Uhrzeit für X-Achse
                    });
                    const temps = data.map(d => d.temperature);
                    
                    if (chart) chart.destroy();
                    const ctx = document.getElementById('tempChart').getContext('2d');
                    chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: times,
                            datasets: [{
                                label: 'Temperatur (°C)',
                                data: temps,
                                borderColor: '#e94560',
                                backgroundColor: 'rgba(233, 69, 96, 0.1)',
                                fill: true
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            plugins: {
                                legend: { labels: { color: 'white' } }
                            },
                            scales: {
                                x: { ticks: { color: 'white', maxRotation: 45, minRotation: 45 } },
                                y: { ticks: { color: 'white' } }
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Fehler:', error);
            }
        }
        
        // Alle 10 Sekunden aktualisieren
        setInterval(() => {
            fetchLatest();
            fetchStats();
            fetchDevices();
            fetchHistory();
        }, 10000);
        
        // Initial laden
        fetchLatest();
        fetchStats();
        fetchDevices();
        fetchHistory();
    </script>
</body>
</html>
