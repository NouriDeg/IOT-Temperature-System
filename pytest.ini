[pytest]
# ============================================
# IOT TEMPERATURE MONITORING SYSTEM - TEST KONFIGURATION
# ============================================

# Testpfade (relativ zum Hauptverzeichnis)
testpaths = tests

# Allgemeine Optionen (NUR EINMAL!)
addopts = -v --tb=short --cov=backend --cov=bridge --cov=provisioner --cov-report=term --cov-report=html

# Markierungen für verschiedene Testarten
markers =
    unit: Unit tests (ohne externe Abhängigkeiten)
    integration: Integration tests (mit echter Datenbank)
    e2e: End-to-End tests (volles System)
    slow: Langsame Tests

# Minimale Coverage (70%)
min_cov = 70

# Timeout für Tests (in Sekunden)
timeout = 300

# Asyncio Modus
asyncio_mode = auto

# Filtere Warnungen
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Python Pfad
pythonpath = .