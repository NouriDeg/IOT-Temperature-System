# ============================================
# MOSQUITTO BROKER KONFIGURATION
# ============================================

# Port 1883 - Unverschlüsselt (für Provisioning & interne Container)
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# Port 8883 - TLS verschlüsselt (für ESP8266)
listener 8883 0.0.0.0
allow_anonymous false
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
require_certificate false
use_identity_as_username false

# Passwortdatei für authentifizierte Benutzer (Port 8883)
password_file /mosquitto/passwd/passwd_file

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type debug

# Verbose Logging für Debug
connection_messages true
log_timestamp true