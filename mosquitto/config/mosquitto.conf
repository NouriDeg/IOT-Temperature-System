# ============================================
# MOSQUITTO BROKER KONFIGURATION
# ============================================

# Port 1883 - MQTT (unverschluesselt) fuer interne Container
listener 1883 0.0.0.0
allow_anonymous false

# Port 8883 - MQTTS (TLS verschluesselt) fuer ESP8266
listener 8883 0.0.0.0
allow_anonymous false
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
require_certificate false

# Port 8084 - WSS (WebSocket Secure) fuer Browser
listener 8084 0.0.0.0
protocol websockets
allow_anonymous false
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt

# Port 8085 - WS (unverschlüsselt - für einfache Tests)
listener 8085 0.0.0.0
protocol websockets
allow_anonymous false

# Passwortdatei
password_file /mosquitto/passwd/passwd_file

# ACL Datei (Access Control List) - Least-Privilege-Prinzip
acl_file /mosquitto/acls/aclfile

# Persistenz
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type all
connection_messages true
