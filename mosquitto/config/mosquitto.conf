# ============================================
# MOSQUITTO BROKER KONFIGURATION
# ============================================

# ------------------------------------------------------------
# LISTENER (Ports auf denen der Broker lauscht)
# ------------------------------------------------------------

# Non-TLS MQTT (für Provisioning, interne Kommunikation)
listener 1883 0.0.0.0
allow_anonymous false

# TLS MQTT (für ESP8266 - verschlüsselt)
listener 8883 0.0.0.0
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
require_certificate false 
allow_anonymous false

# WebSocket (für Browser/MQTT Explorer)
listener 8085 0.0.0.0
protocol websockets
allow_anonymous false

# WebSocket Secure (für Browser mit TLS - WICHTIG!)
listener 8084 0.0.0.0
protocol websockets
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
allow_anonymous false

# ------------------------------------------------------------
# AUTHENTIFIZIERUNG
# ------------------------------------------------------------

# Pfad zur Passwort-Datei
password_file /mosquitto/config/passwd
# Pfad zur ACL Datei (Zugriffsrechte)
acl_file /mosquitto/acls/aclfile

# ------------------------------------------------------------
# PERSISTENZ
# ------------------------------------------------------------

# Nachrichten persistent speichern
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------

# Log-Ausgaben (für Docker: stdout)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ------------------------------------------------------------
# SICHERHEIT
# ------------------------------------------------------------

# Keine anonymen Verbindungen (global)
allow_anonymous false

# Verbindungs-Timeout (Sekunden)
connection_messages true

# Maximale Client-Verbindungen
max_connections -1

# Maximale Nachrichtengröße (10 MB)
message_size_limit 1048576



