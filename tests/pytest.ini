[pytest]
# Test-Pfade
testpaths = tests

# Markierungen für verschiedene Test-Typen
markers =
    unit: Unit tests (schnell, keine externen Abhängigkeiten)
    integration: Integration tests (benötigt laufende Services)
    e2e: End-to-End tests (benötigt vollständiges System)
    slow: Langsame Tests
    skip_ci: Tests die in CI übersprungen werden

# Ausgabe-Optionen (nur einmal definieren!)
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Keine anderen Befehle hier!