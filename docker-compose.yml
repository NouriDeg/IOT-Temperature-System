# ============================================================================
# DOCKER COMPOSE KONFIGURATION - 3-ZONEN-SICHERHEITSARCHITEKTUR
# ============================================================================
# 
# Version: 4.0 (Security Enhanced)
# Datum: 30.04.2026
# Autor: Nouri Deg.

# Diese Konfiguration implementiert eine professionelle Sicherheitsarchitektur
# mit drei Netzwerk-Zonen (DMZ, Internal, Database) nach dem Least-Privilege-Prinzip.
# 
# NETZWERKARCHITEKTUR:
# 
#   DMZ NETZWERK (Public) - Von außen erreichbare Services                 
#   - frontend (Port 8080): Web Dashboard                                  
#   - backend (Port 5000): REST API                                        
#   - mosquitto (Ports 1883,8883,8084,8085): MQTT Broker                  
# 
#                                    │
#                                    ▼ (nur erlaubte Kommunikation)
# 
#   INTERNAL NETZWERK (Backend) - Kein externer Zugriff!                   
#   - bridge: MQTT → PostgreSQL Übersetzer                                 
#   - provisioner: Automatisches Geräte-Onboarding                         
# 
#                                    │
#                                    ▼ (nur Datenbank-Zugriff)
# 
#   DATABASE NETZWERK (Data Layer) - Höchste Sicherheitszone!              
#   - postgres: PostgreSQL 15 Datenbank (absolut isoliert)                 
# 
# 
# SICHERHEITSMERKMALE:
# - 3 separate Netzwerk-Zonen mit internal: true für Backend und Database
# - Least-Privilege-Prinzip: Container haben nur notwendige Netzwerkzugriffe
# - Healthchecks für kritische Services
# - Read-only Volumes für Konfigurationen
# - Secrets über .env Datei (nicht hardcoded)
# - Security_opt: no-new-privileges verhindert Privilegien-Eskalation
# - Logging-Begrenzung (max. 10MB pro Datei)
# ============================================================================

# ============================================================================
# NETZWERKE (3 Security-Zonen)
# ============================================================================
# Die Netzwerke wurden bereits mit docker network create erstellt:
# - docker network create --driver bridge --subnet=10.100.0.0/24 iot_dmz_network
# - docker network create --driver bridge --internal --subnet=10.101.0.0/24 iot_internal_network
# - docker network create --driver bridge --internal --subnet=10.102.0.0/24 iot_database_network

networks:
  # --------------------------------------------------------------------------
  # 1. DMZ NETZWERK (Public: Demilitarized Zone)
  # --------------------------------------------------------------------------
  # Zweck: Aufnahme von Services, die von außen erreichbar sein müssen
  # Enthält: frontend, backend, mosquitto, nginx_wss_proxy
  # Sicherheit: Keine Verbindung zum Database Netzwerk!
  # Von außen erreichbar: HTTP (8080), API (5000), MQTT (1883,8883,8084,8085)
  dmz_network:
    name: iot_dmz_network
    external: true                    # Bestehendes Netzwerk verwenden (nicht neu erstellen)
  
  # --------------------------------------------------------------------------
  # 2. INTERNAL NETZWERK (Backend Services)
  # --------------------------------------------------------------------------
  # Zweck: Aufnahme von Services mit Geschäftslogik
  # Enthält: bridge, provisioner
  # Sicherheit: internal: true = KEIN externer Zugriff möglich!
  # Kommunikation: Nur von DMZ Netzwerk erreichbar, nicht von außen
  internal_network:
    name: iot_internal_network
    external: true                    # Bestehendes Netzwerk verwenden
  
  # --------------------------------------------------------------------------
  # 3. DATABASE NETZWERK (Data Layer: Höchste Sicherheitszone)
  # --------------------------------------------------------------------------
  # Zweck: Absolute Isolierung der Datenbank
  # Enthält: postgres
  # Sicherheit: internal: true + höchste Isolierungsstufe
  # Zugriff: Nur von bridge und provisioner aus dem Internal Netzwerk
  database_network:
    name: iot_database_network
    external: true                    # Bestehendes Netzwerk verwenden

# ============================================================================
# VOLUMES (Persistente Datenspeicherung)
# ============================================================================
# Daten überleben sogar bei Container-Neustarts und -Löschungen

volumes:
  # PostgreSQL Datenbankdateien (sensor_data, device_status, devices)
  postgres_data:
    name: iot_postgres_data
  # pgAdmin Konfigurationen (optional, nur Entwicklung)
  pgadmin_data:
    name: iot_pgadmin_data
  # Mosquitto Persistenz (Client-Sessions, Retained Messages)
  mosquitto_data:
    name: iot_mosquitto_data
  # Mosquitto Logs (für Debugging)
  mosquitto_log:
    name: iot_mosquitto_log

# ============================================================================
# SERVICES (Container)
# ============================================================================

services:
  
  # ==========================================================================
  # DMZ NETZWERK - Öffentlich erreichbare Services
  # ==========================================================================

  # --------------------------------------------------------------------------
  # 1. MQTT BROKER (Eclipse Mosquitto)
  # --------------------------------------------------------------------------
  # Aufgabe: Zentraler Message Broker für MQTT Kommunikation
  # 
  # Ports:
  # - 1883: MQTT (unverschlüsselt) für Bridge, Provisioner
  # - 8883: MQTTS (TLS) für ESP8266
  # - 8084: WSS (WebSocket Secure) für Browser
  # - 8085: WS (unverschlüsselt) für MQTT Explorer
  # 
  # Netzwerke: DMZ (extern) + Internal (für Bridge/Provisioner)
  # --------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0                # Offizielles Mosquitto 2.0 Image
    container_name: mqtt_broker                 # Fester Container-Name für DNS
    restart: unless-stopped                      # Automatischer Neustart bei Absturz
    
    # Exponierte Ports (Host:Container)
    ports:
      - "1883:1883"      # MQTT (unverschlüsselt) - Bridge, Provisioner
      - "8883:8883"      # MQTTS (TLS) - ESP8266 (verschlüsselt)
      - "8084:8084"      # WSS (WebSocket Secure) - Browser (TLS)
      - "8085:8085"      # WS (unverschlüsselt) - MQTT Explorer / Tests
    
    # Volumes für Konfiguration und Persistenz
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro      # Konfiguration (read-only)
      - mosquitto_data:/mosquitto/data               # Persistente Daten
      - mosquitto_log:/mosquitto/log                 # Log-Dateien
      - ./mosquitto/passwd:/mosquitto/passwd:ro      # Passwortdatei (read-only)
      - ./certs:/mosquitto/certs:ro                  # TLS Zertifikate (read-only)
      - ./mosquitto/acls:/mosquitto/acls:ro          # ACL Datei (read-only)
    
    environment:
      - TZ=Europe/Berlin                             # Zeitzone für korrekte Logs
    
    # Gesundheitscheck - prüft ob Mosquitto Prozess läuft
    healthcheck:
      test: ["CMD", "pgrep", "mosquitto"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    # Dual-Netzwerk: DMZ (extern) + Internal (Backend-Kommunikation)
    networks:
      - dmz_network          # Für externe Clients (ESP8266, Browser)
      - internal_network     # Für Bridge und Provisioner
    
    # Sicherheitsoption: Verhindert Privilegien-Eskalation
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # 2. BACKEND API (Flask)
  # --------------------------------------------------------------------------
  # Aufgabe: REST API für Frontend und externe Clients
  # 
  # Endpunkte:
  # - GET /api/latest - Aktuellste Temperatur
  # - GET /api/stats - Statistiken (Min, Max, Avg)
  # - GET /api/history - Temperaturverlauf (Zeitreihen)
  # - GET /api/devices/status - Gerätestatus (online/offline)
  # - GET /api/lwt/stats - LWT Statistiken
  # 
  # Netzwerke: DMZ (Frontend) + Database (Datenbankzugriff)
  # --------------------------------------------------------------------------
  backend:
    build: ./backend
    container_name: api_backend
    restart: unless-stopped
    
    ports:
      - "5000:5000"                                 # Flask Standardport
    
    environment:
      DB_HOST: postgres_db                          # Container-Name (wichtig: postgres_db!)
      DB_PORT: 5432
      DB_NAME: sensordb
      DB_USER: sensor_user
      DB_PASSWORD: ${DB_PASSWORD}                   # Passwort aus .env Datei
      FLASK_ENV: production                         # Produktionsmodus
      FLASK_DEBUG: 0                                # Debug deaktiviert (sicherer)
    
    depends_on:
      postgres:
        condition: service_healthy                  # Wartet auf gesunde DB
    
    # Dual-Netzwerk: DMZ (für Frontend-Zugriff) + Database (für Datenbank)
    networks:
      - dmz_network          # Für Frontend API Calls
      - database_network     # Für direkten Datenbankzugriff
    
    security_opt:
      - no-new-privileges:true
    
    # Logging mit Rotation (verhindert unendliches Wachstum)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"                              # Max. 10 MB pro Datei
        max-file: "3"                                # Max. 3 Dateien

  # --------------------------------------------------------------------------
  # 3. FRONTEND (Nginx Static Webserver)
  # --------------------------------------------------------------------------
  # Aufgabe: Auslieferung der Single Page Application (SPA)
  # 
  # Funktionen:
  # - Liefert HTML, CSS, JavaScript Dateien aus
  # - Serverseitiges Routing für SPA
  # - Proxy für API Calls zum Backend (vermeidet CORS)
  # 
  # Netzwerk: Nur DMZ (erreicht Backend über internal_network nicht direkt)
  # --------------------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: web_frontend
    restart: unless-stopped
    
    ports:
      - "8080:80"                                    # Nginx Standardport
    
    depends_on:
      - backend                                      # Wartet auf Backend
    
    networks:
      - dmz_network                                  # Nur DMZ Netzwerk
    
    security_opt:
      - no-new-privileges:true
    
    # read_only: true                                # (Auskommentiert - Nginx braucht Schreibrechte für Cache)
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # INTERNAL NETZWERK (Backend - Kein externer Zugriff!)
  # ==========================================================================

  # --------------------------------------------------------------------------
  # 4. MQTT BRIDGE (Python)
  # --------------------------------------------------------------------------
  # Aufgabe: Verbindet MQTT mit PostgreSQL
  # 
  # Funktionen:
  # - Abonniert sensor/temperatur Topic
  # - Validiert JSON Payloads gegen Schema
  # - Speichert Daten in PostgreSQL
  # - Aktualisiert Gerätestatus (online/offline)
  # - Verarbeitet Heartbeat und LWT Nachrichten
  # 
  # Netzwerke: Internal (MQTT) + Database (PostgreSQL)
  # Sicherheit: read_only: true - Keine Schreibrechte im Container
  # --------------------------------------------------------------------------
  bridge:
    build: ./bridge
    container_name: mqtt_bridge
    restart: unless-stopped
    
    environment:
      # MQTT Verbindungsparameter
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_BRIDGE_USER: ${MQTT_BRIDGE_USER}
      MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD}
      # Datenbank Verbindungsparameter
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: sensordb
      DB_USER: sensor_user
      DB_PASSWORD: ${DB_PASSWORD}
    
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    
    networks:
      - internal_network     # Für MQTT Kommunikation mit Mosquitto
      - database_network     # Für Datenbankzugriff
    
    security_opt:
      - no-new-privileges:true
    
    read_only: true                                   # Erhöhte Sicherheit
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # 5. PROVISIONING SERVICE (Python)
  # --------------------------------------------------------------------------
  # Aufgabe: Automatisches Geräte-Onboarding
  # 
  # Funktionen:
  # - Empfängt Provisioning Requests von neuen ESP8266
  # - Generiert eindeutige MQTT Credentials
  # - Erstellt TLS Zertifikate (optional)
  # - Speichert Geräte in devices Tabelle
  # 
  # Netzwerke: Internal (MQTT) + Database (PostgreSQL)
  # Sicherheit: read_only: true + CA Zertifikate read-only
  # --------------------------------------------------------------------------
  provisioner:
    build: ./provisioner
    container_name: provisioner_service
    restart: unless-stopped
    
    environment:
      # MQTT Verbindungsparameter
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_PROVISION_USER: ${MQTT_PROVISION_USER}
      MQTT_PROVISION_PASSWORD: ${MQTT_PROVISION_PASSWORD}
      # Datenbank Verbindungsparameter
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: sensordb
      DB_USER: sensor_user
      DB_PASSWORD: ${DB_PASSWORD}
      # Externe Broker Adresse (für ESP8266)
      MQTT_BROKER_ADDRESS: ${MQTT_BROKER_ADDRESS}
    
    volumes:
      - ./certs:/app/certs:ro                        # CA Zertifikate (read-only)
    
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    
    networks:
      - internal_network     # Für MQTT Kommunikation
      - database_network     # Für Datenbankzugriff
    
    security_opt:
      - no-new-privileges:true
    
    read_only: true
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # DATABASE NETZWERK (Höchste Sicherheitszone)
  # ==========================================================================

  # --------------------------------------------------------------------------
  # 6. POSTGRESQL DATABASE (Nur Database Network)
  # --------------------------------------------------------------------------
  # Aufgabe: Zentrale Datenbank für alle persistenten Daten
  # 
  # Tabellen:
  # - sensor_data: Temperaturmessungen (Zeitreihen)
  # - device_status: Online/Offline Status der Geräte
  # - devices: Provisionierte Geräte mit Credentials
  # 
  # Sicherheit:
  # - NUR database_network (absolut isoliert!)
  # - KEINE externen Ports!
  # - Healthcheck für Verfügbarkeit
  # - Passwort aus .env Datei
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15                              # Offizielles PostgreSQL 15
    container_name: postgres_db
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: sensordb                         # Datenbankname
      POSTGRES_USER: sensor_user                    # Datenbankbenutzer
      POSTGRES_PASSWORD: ${DB_PASSWORD}             # Passwort aus .env
      TZ: Europe/Berlin                             # Zeitzone für Zeitstempel
      PGTZ: Europe/Berlin                           # PostgreSQL-interne Zeitzone
    
    # WICHTIG: KEINE externen Ports für maximale Sicherheit!
    # Kein "ports:" Eintrag - Datenbank ist nur intern erreichbar!
    
    volumes:
      - postgres_data:/var/lib/postgresql/data      # Persistente Daten
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # Initialisierung
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_user -d sensordb"]
      interval: 30s
      timeout: 10s
      retries: 5
    
    networks:
      - database_network                            # NUR Database Netzwerk!
    
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # ENTWICKLUNG & OPTIONALE SERVICES
  # ==========================================================================

  # --------------------------------------------------------------------------
  # 7. PGADMIN (Nur Entwicklung - mit dev-Profil)
  # --------------------------------------------------------------------------
  # Aufgabe: Grafische Datenbankverwaltung
  # 
  # Funktionen:
  # - Tabellen visualisieren
  # - SQL Abfragen ausführen
  # - Datenbank-Backups erstellen
  # 
  # Hinweis: Nur in Entwicklungsumgebung aktivieren (--profile dev)
  # Sicherheit: Nicht für Produktion empfohlen!
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    profiles:
      - dev                                         # Nur mit --profile dev starten
    
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'           # Einzelbenutzer-Modus
    
    ports:
      - "5050:80"                                    # Web-Interface Port
    
    volumes:
      - pgadmin_data:/var/lib/pgadmin               # Persistente Konfiguration
    
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - dmz_network          # Für Web-Zugriff
      - database_network     # Für direkten DB-Zugriff (nur Entwicklung!)
    
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # 8. NGINX WSS PROXY (Optional - mit wss-Profil)
  # --------------------------------------------------------------------------
  # Aufgabe: WebSocket Secure Proxy für MQTT over WSS
  # 
  # Funktionen:
  # - Leitet WSS Verbindungen an Mosquitto weiter
  # - SSL Termination für WebSocket Verbindungen
  # - Standard-Ports 80 und 443
  # 
  # Ports:
  # - 80: HTTP (Weiterleitung zu HTTPS)
  # - 443: HTTPS/WSS (verschlüsselte WebSockets)
  # --------------------------------------------------------------------------
  nginx_wss_proxy:
    image: nginx:alpine
    container_name: nginx_wss_proxy
    restart: unless-stopped
    profiles:
      - wss                                         # Nur mit --profile wss starten
    
    ports:
      - "80:80"                                      # HTTP (Weiterleitung)
      - "443:443"                                    # HTTPS / WSS
    
    volumes:
      - ./wss-demo/nginx/nginx.conf:/etc/nginx/nginx.conf:ro   # Nginx Konfiguration
      - ./certs:/etc/nginx/certs:ro                            # TLS Zertifikate
    
    networks:
      - dmz_network                                  # Nur DMZ Netzwerk
    
    security_opt:
      - no-new-privileges:true