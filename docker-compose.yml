# ============================================
# DOCKER COMPOSE KONFIGURATION
# IoT Temperature Monitoring System
# ============================================
# Dieses File definiert alle Container des Systems:
# - Mosquitto MQTT Broker (mit TLS und Authentifizierung)
# - PostgreSQL Datenbank (mit Healthcheck)
# - pgAdmin4 (Datenbank Verwaltung)
# - Bridge Service (MQTT → PostgreSQL)
# - Provisioning Service (automatisches Geräte-Onboarding)
# - Backend API (Flask Dashboard)
# - Frontend (Nginx statisches Dashboard)
# 
# Sicherheitsfeatures:
# - Least-Privilege-Prinzip durch ACLs
# - Read-only Volumes wo möglich
# - Healthchecks für alle Services
# - Passwörter über .env Datei (nicht hardcoded)
# ============================================

# ============================================
# SERVICES (Container)
# ============================================

services:
  # ============================================
  # 1. MQTT BROKER (Eclipse Mosquitto)
  # ============================================
  # Verantwortlich für die gesamte MQTT Kommunikation
  # - Empfängt Temperaturdaten vom ESP8266 (Port 8883 TLS)
  # - Empfängt Provisioning Requests (Port 1883)
  # - Leitet Daten an Bridge und Provisioner weiter
  # - Verwaltet Authentifizierung und ACLs
  # - Least-Privilege-Prinzip durch ACL Datei
  # ============================================
  mosquitto:
    image: eclipse-mosquitto:2.0                    # Offizielles Mosquitto Image
    container_name: mqtt_broker                     # Fester Container-Name
    ports:
      - "1883:1883"      # MQTT (unverschlüsselt) - Für Provisioning & Bridge
      - "8883:8883"      # MQTTS (TLS verschlüsselt) - Für ESP8266 über WLAN
      - "8084:8084"      # WSS (WebSocket Secure) für Browser
      - "8085:8085"      # Neuer unverschlüsselter WS Port
    volumes:
      # Konfigurationsdatei (read-only für Sicherheit)
      - ./mosquitto/config:/mosquitto/config:ro
      # ACL Datei (read-only) - Least-Privilege-Prinzip
      - ./certs:/mosquitto/certs:ro
      # Passwortdatei für Benutzer (read-only)
      - ./mosquitto/passwd:/mosquitto/passwd:ro
      # Logs (schreibbar für Mosquitto)
      - ./mosquitto/log:/mosquitto/log
      # Daten (schreibbar für Persistenz)
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/acls:/mosquitto/acls:ro   # ← ACL Datei (read-only)
    environment:
      - TZ=Europe/Berlin                            # Zeitzone für Logs
    restart: unless-stopped                         # Automatischer Neustart bei Absturz
    healthcheck:
      # Prüft ob der Broker läuft
      test: ["CMD", "pgrep", "mosquitto"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - iot_network
    

  # ============================================
  # 2. POSTGRESQL DATENBANK
  # ============================================
  # Zentrale Datenbank für:
  # - Temperaturdaten (sensor_data Tabelle)
  # - Gerätestatus (device_status Tabelle)
  # - Provisionierte Geräte (devices Tabelle)
  # ============================================
  postgres:
    image: postgres:15                              # Offizielles PostgreSQL 15 Image
    container_name: postgres_db                     # Fester Container-Name
    environment:
      POSTGRES_DB: sensordb                         # Name der Standard-Datenbank
      POSTGRES_USER: sensor_user                    # Datenbank-Benutzer
      POSTGRES_PASSWORD: ${DB_PASSWORD}             # Passwort aus .env Datei
      TZ: Europe/Berlin                             # Zeitzone für Zeitstempel
      PGTZ: Europe/Berlin                           # PostgreSQL Zeitzone
    ports:
      - "5432:5432"      # PostgreSQL Standardport (für externe Tools wie pgAdmin)
    volumes:
      # Persistente Datenspeicherung (Daten überleben Container-Neustarts)
      - postgres_data:/var/lib/postgresql/data
      # Initialisierungsskripte (werden beim ersten Start ausgeführt)
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      # Prüft ob die Datenbank bereit ist
      test: ["CMD-SHELL", "pg_isready -U sensor_user -d sensordb"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - iot_network
    security_opt:
      - no-new-privileges:true

  # ============================================
  # 3. PGADMIN4 (Datenbank Verwaltung)
  # ============================================
  # Grafische Oberfläche für PostgreSQL Datenbank
  # - Ermöglicht einfache Datenbankverwaltung
  # - SQL Editor für Abfragen
  # - Tabellenstruktur visualisieren
  # - Backup und Restore Funktionen
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest                    # Offizielles pgAdmin4 Image
    container_name: pgadmin                         # Fester Container-Name
    environment:
      # Zugangsdaten für pgAdmin Webinterface (aus .env Datei)
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}       # Login E-Mail (aus .env)
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD} # Login Passwort (aus .env)
      PGADMIN_CONFIG_SERVER_MODE: 'False'           # Einzelbenutzer-Modus
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'  # Kein Master-Passwort
    ports:
      - "5050:80"          # pgAdmin Webinterface Port
    volumes:
      # Persistente Speicherung für Server-Konfigurationen
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - iot_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # 4. BRIDGE SERVICE (MQTT → PostgreSQL)
  # ============================================
  # Empfängt MQTT Nachrichten und speichert sie in PostgreSQL
  # - Abonniert sensor/temperatur Topic
  # - Validiert JSON Payloads gegen Schema
  # - Speichert Daten in der Datenbank
  # - Behandelt Geräte-Status Updates
  # - Least-Privilege: Nur Leserechte auf MQTT, Nur Schreibrecht auf DB
  # ============================================
  bridge:
    build: ./bridge                                  # Baut Image aus ./bridge/Dockerfile
    container_name: mqtt_bridge
    environment:
      # MQTT Verbindungsparameter
      MQTT_HOST: mosquitto                           # Container-Name als Hostname (Docker DNS)
      MQTT_PORT: 1883                                # Interner Port (ohne TLS)
      MQTT_BRIDGE_USER: ${MQTT_BRIDGE_USER}          # Bridge Benutzername aus .env
      MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD}  # Bridge Passwort aus .env
      # Datenbank Verbindungsparameter
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sensordb
      DB_USER: sensor_user
      DB_PASSWORD: ${DB_PASSWORD}                    # Datenbank Passwort aus .env
    depends_on:
      mosquitto:
        condition: service_healthy                   # Wartet bis Mosquitto gesund ist
      postgres:
        condition: service_healthy                   # Wartet bis PostgreSQL gesund ist
    restart: unless-stopped
    networks:
      - iot_network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"                              # Maximale Log-Größe
        max-file: "3"                                # Anzahl der Log-Dateien

  # ============================================
  # 5. PROVISIONING SERVICE (Geräte-Onboarding)
  # ============================================
  # Automatische Registrierung neuer ESP8266 Geräte
  # - Empfängt Provisioning Requests von neuen Geräten
  # - Generiert eindeutige MQTT Credentials
  # - Erstellt TLS Zertifikate
  # - Speichert Geräte in der Datenbank
  # ============================================
  provisioner:
    build: ./provisioner                             # Baut Image aus ./provisioner/Dockerfile
    container_name: provisioner_service
    environment:
      # MQTT Verbindungsparameter
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_PROVISION_USER: ${MQTT_PROVISION_USER}    # Provisioner Benutzername aus .env
      MQTT_PROVISION_PASSWORD: ${MQTT_PROVISION_PASSWORD}  # Provisioner Passwort aus .env
      # Datenbank Verbindungsparameter
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sensordb
      DB_USER: sensor_user
      DB_PASSWORD: ${DB_PASSWORD}
      # MQTT Broker Adresse (für ESP8266, muss von außen erreichbar sein!)
      MQTT_BROKER_ADDRESS: ${MQTT_BROKER_ADDRESS}    # IP des Windows Rechners
    volumes:
      - ./certs:/app/certs:ro                        # CA Zertifikate für TLS (read-only)
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - iot_network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # 6. BACKEND API (Flask Dashboard)
  # ============================================
  # REST API und Web Dashboard
  # - Zeigt Live-Dashboard mit Chart.js
  # - Bietet REST Endpunkte für Temperaturdaten
  # - Holt Daten aus PostgreSQL
  # - Least-Privilege: Nur Leserechte auf DB
  # ============================================
  backend:
    build: ./backend                                  # Baut Image aus ./backend/Dockerfile
    container_name: api_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sensordb
      DB_USER: sensor_user
      DB_PASSWORD: ${DB_PASSWORD}
      FLASK_ENV: production                          # Produktionsmodus
      FLASK_DEBUG: 0                                 # Debug deaktiviert
    ports:
      - "5000:5000"      # Flask Standardport für Web Dashboard
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - iot_network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # 7. FRONTEND (Nginx - statisches Dashboard)
  # ============================================
  # Alternatives statisches Web Dashboard
  # - Dient als Fallback oder für einfache Visualisierung
  # - Zeigt die aktuellste Temperatur an
  # - Statische Dateien, daher sehr sicher
  # ============================================
  frontend:
    build: ./frontend                                 # Baut Image aus ./frontend/Dockerfile
    container_name: web_frontend
    ports:
      - "8080:80"          # Nginx Standardport für Web Dashboard
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - iot_network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================
# VOLUMES (Persistente Datenspeicherung)
# ============================================
# Diese Volumes bleiben erhalten, auch wenn Container gelöscht werden
volumes:
  postgres_data:            # PostgreSQL Datenbankdateien
    name: iot_postgres_data
    driver: local
  pgadmin_data:             # pgAdmin Konfigurationen
    name: iot_pgadmin_data
    driver: local

# ============================================
# NETZWERK
# ============================================
# Alle Container kommunizieren über dieses Bridge-Netzwerk
networks:
  iot_network:
    name: iot_network        # Benutzerdefinierter Netzwerkname
    driver: bridge