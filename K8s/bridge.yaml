apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: iot-temperature
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
      - name: bridge
        image: iot-bridge:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MQTT_HOST
          valueFrom:
            configMapKeyRef:
              name: iot-config
              key: MQTT_HOST
        - name: MQTT_PORT
          valueFrom:
            configMapKeyRef:
              name: iot-config
              key: MQTT_PORT
        - name: MQTT_BRIDGE_USER
          valueFrom:
            configMapKeyRef:
              name: iot-config
              key: MQTT_BRIDGE_USER
        - name: MQTT_BRIDGE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iot-secrets
              key: MQTT_BRIDGE_PASSWORD
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: iot-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: iot-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: iot-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: iot-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iot-secrets
              key: DB_PASSWORD
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: iot-config
              key: TZ
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: bridge-service
  namespace: iot-temperature
spec:
  selector:
    app: bridge
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP