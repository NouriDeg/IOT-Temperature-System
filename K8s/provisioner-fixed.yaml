# k8s/provisioner-fixed.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner
  namespace: iot-temperature
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioner
  template:
    metadata:
      labels:
        app: provisioner
    spec:
      containers:
      - name: provisioner
        image: iot-provisioner:latest
        imagePullPolicy: Never