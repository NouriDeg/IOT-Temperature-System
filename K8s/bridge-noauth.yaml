apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: iot-temperature
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
      - name: bridge
        image: iot-bridge:v2.0
        imagePullPolicy: IfNotPresent
        env:
        - name: MQTT_HOST
          value: "mosquitto-service"
        - name: MQTT_PORT
          value: "1883"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "sensordb"
        - name: DB_USER
          value: "sensor_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iot-secrets
              key: DB_PASSWORD
        - name: TZ
          value: "Europe/Berlin"
