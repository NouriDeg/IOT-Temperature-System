apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
  namespace: iot-temperature
spec:
  serviceName: mosquitto
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
        - containerPort: 8883
        args:
        - /usr/sbin/mosquitto
        - -v
