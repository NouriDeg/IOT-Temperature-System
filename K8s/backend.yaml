# k8s/backend.yaml - Korrigierte Version
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: iot-temperature
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: iot-backend:latest
        imagePullPolicy: IfNotPresent  # Oder "Never" für lokale Images
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "sensordb"
        - name: DB_USER
          value: "sensor_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iot-secrets
              key: DB_PASSWORD