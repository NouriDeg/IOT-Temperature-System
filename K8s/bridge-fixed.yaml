# k8s/bridge-fixed.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: iot-temperature
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
      - name: bridge
        image: iot-bridge:latest
        imagePullPolicy: Never