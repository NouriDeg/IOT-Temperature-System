apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-config
  namespace: iot-temperature
data:
  # Datenbank
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "sensordb"
  DB_USER: "sensor_user"
  
  # MQTT
  MQTT_HOST: "mosquitto-service"
  MQTT_PORT: "1883"
  MQTT_PORT_TLS: "8883"
  MQTT_PORT_WS: "8085"
  MQTT_PORT_WSS: "8084"
  
  # API
  FLASK_ENV: "production"
  API_BASE_URL: "http://backend-service:5000/api"
  
  # Zeitzone
  TZ: "Europe/Berlin"
  PGTZ: "Europe/Berlin"
  
  # MQTT Credentials (User)
  MQTT_BRIDGE_USER: "bridge_user"
  MQTT_PROVISION_USER: "provisioner"
  MQTT_TEST_USERNAME: "test_device"
  
  # pgAdmin
  PGADMIN_EMAIL: "admin@iot-system.local"