apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: iot-temperature
data:
  init.sql: |
    -- Sensor Daten Tabelle
    CREATE TABLE IF NOT EXISTS sensor_data (
        id BIGSERIAL PRIMARY KEY,
        device_id VARCHAR(64) NOT NULL,
        device_type VARCHAR(32),
        sensor_type VARCHAR(32),
        value DECIMAL(10,2),
        unit VARCHAR(16),
        raw_payload JSONB,
        received_at TIMESTAMPTZ DEFAULT NOW()
    );
    
    -- Device Status Tabelle
    CREATE TABLE IF NOT EXISTS device_status (
        device_id VARCHAR(64) PRIMARY KEY,
        status VARCHAR(20) DEFAULT 'offline',
        last_seen TIMESTAMPTZ,
        last_rssi INTEGER,
        last_free_heap INTEGER,
        updated_at TIMESTAMPTZ
    );
    
    -- Devices Tabelle (Provisioning)
    CREATE TABLE IF NOT EXISTS devices (
        id SERIAL PRIMARY KEY,
        device_id VARCHAR(64) UNIQUE NOT NULL,
        mac_address VARCHAR(17) UNIQUE NOT NULL,
        mqtt_username VARCHAR(64) UNIQUE,
        mqtt_password_hash VARCHAR(255),
        status VARCHAR(20) DEFAULT 'pending',
        provisioned_at TIMESTAMPTZ DEFAULT NOW()
    );
    
    -- Indizes
    CREATE INDEX IF NOT EXISTS idx_sensor_data_device_id ON sensor_data(device_id);
    CREATE INDEX IF NOT EXISTS idx_sensor_data_received_at ON sensor_data(received_at);