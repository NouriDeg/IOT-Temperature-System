version: '3.8'

services:
  nginx_wss_proxy:
    image: nginx:alpine
    container_name: nginx_wss_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./wss-demo/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - dmz_network
    security_opt:
      - no-new-privileges:true  