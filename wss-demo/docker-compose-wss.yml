version: '3.8'

services:
  nginx-wss:
    image: nginx:alpine
    container_name: nginx_wss_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro
    networks:
      - iot_network
    restart: unless-stopped

networks:
  iot_network:
    external: true
    name: iot_network