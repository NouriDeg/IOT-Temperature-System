<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT WSS Dashboard</title>
    
    <!-- ==========================================
         EXTERNE BIBLIOTHEK: MQTT.js
         ========================================== -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    
    <style>
        /* ===== GLOBALE STYLES ===== */
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8edf5;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        h1 {
            text-align: center;
            color: #e8edf5;
            font-size: 2.2em;
            margin-bottom: 30px;
        }
        h1 span { color: #ff6b8a; }
        
        h3 {
            color: #e8edf5;
            margin-top: 0;
            border-bottom: 2px solid #ff6b8a;
            padding-bottom: 8px;
        }
        
        .card {
            background: rgba(36, 52, 71, 0.9);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 20px;
            border: 1px solid #2a3a4f;
        }
        
        /* ===== TEMPERATUR-GRID ===== */
        .temp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .temp-card {
            background: #1e2d42;
            border-radius: 12px;
            padding: 20px;
            border-left: 6px solid #4CAF50;
            transition: all 0.3s ease;
            border: 1px solid #2a3a4f;
        }
        
        .temp-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            background: #243447;
        }
        
        .temp-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .temp-card-device {
            font-weight: 700;
            background: #1a2332;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
        }
        
        .temp-card-rssi {
            font-size: 0.8em;
            color: #8a9bb5;
            background: #1a2332;
            padding: 3px 10px;
            border-radius: 20px;
        }
        
        .temp-value {
            font-size: 3em;
            text-align: center;
            padding: 15px 0;
            font-weight: 700;
            letter-spacing: -1px;
        }
        
        .temp-unit {
            font-size: 0.4em;
            font-weight: 400;
            color: #8a9bb5;
        }
        
        .temp-card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #8a9bb5;
            border-top: 1px solid #2a3a4f;
            padding-top: 10px;
            margin-top: 5px;
        }
        
        .temp-card-footer span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* ===== TEMPERATUR-FARBEN ===== */
        .temp-normal { color: #66bb6a; }
        .temp-warm   { color: #ffa726; }
        .temp-hot    { color: #ef5350; }
        .temp-cold   { color: #42a5f5; }
        
        .border-normal { border-left-color: #66bb6a; }
        .border-warm   { border-left-color: #ffa726; }
        .border-hot    { border-left-color: #ef5350; }
        .border-cold   { border-left-color: #42a5f5; }
        
        /* ===== INPUT-GRUPPEN ===== */
        .input-group {
            display: flex;
            gap: 12px;
            margin: 12px 0;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .input-group input {
            flex: 1;
            min-width: 120px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid #2a3a4f;
            background: #1a2332;
            color: #e8edf5;
            font-size: 0.95em;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #ff6b8a;
            background: #1e2d42;
        }
        
        .input-group input::placeholder {
            color: #6a7a8f;
        }
        
        /* ===== PASSWORD WRAPPER ===== */
        .password-wrapper {
            display: flex;
            flex: 1;
            min-width: 120px;
            align-items: center;
            background: #1a2332;
            border: 2px solid #2a3a4f;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        
        .password-wrapper:focus-within {
            border-color: #ff6b8a;
            background: #1e2d42;
        }
        
        .password-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 14px;
            min-width: 60px;
            font-size: 0.95em;
            color: #e8edf5;
        }
        
        .password-wrapper input:focus {
            outline: none;
        }
        
        .password-toggle {
            background: transparent;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 1.2em;
            color: #8a9bb5;
            transition: color 0.3s;
            border-radius: 0 8px 8px 0;
            min-width: 44px;
            min-height: 44px;
        }
        
        .password-toggle:hover {
            color: #ff6b8a;
            background: rgba(255, 107, 138, 0.1);
        }
        
        .password-toggle.active {
            color: #66bb6a;
        }
        
        /* ===== BUTTONS ===== */
        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-connect {
            background: #2e7d32;
            color: white;
        }
        .btn-connect:hover {
            background: #388e3c;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }
        
        .btn-disconnect {
            background: #c62828;
            color: white;
        }
        .btn-disconnect:hover {
            background: #d32f2f;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(198, 40, 40, 0.3);
        }
        
        .btn-clear {
            background: #455a64;
            color: white;
        }
        .btn-clear:hover {
            background: #546e7a;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(69, 90, 100, 0.3);
        }
        
        /* ===== STATUS ===== */
        .status-display {
            font-size: 1.1em;
            padding: 12px 16px;
            border-radius: 8px;
            background: #1a2332;
            margin: 5px 0;
            font-weight: 600;
        }
        
        .status-online {
            color: #66bb6a;
            background: #1b3a2a;
        }
        
        .status-offline {
            color: #ef5350;
            background: #3a1a1a;
        }
        
        .status-connecting {
            color: #ffa726;
            background: #3a2a1a;
        }
        
        #client-id {
            font-size: 0.85em;
            color: #8a9bb5;
            margin-top: 5px;
            font-family: 'Courier New', monospace;
        }
        
        #device-count {
            font-size: 0.95em;
            color: #e8edf5;
            margin-top: 8px;
            font-weight: 600;
        }
        
        /* ===== NACHRICHTEN ===== */
        .messages-card {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .messages-card::-webkit-scrollbar {
            width: 6px;
        }
        .messages-card::-webkit-scrollbar-track {
            background: #1a2332;
            border-radius: 3px;
        }
        .messages-card::-webkit-scrollbar-thumb {
            background: #2a3a4f;
            border-radius: 3px;
        }
        .messages-card::-webkit-scrollbar-thumb:hover {
            background: #3a4a5f;
        }
        
        .msg-item {
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-left: 4px solid #ff6b8a;
            font-size: 0.85em;
            word-break: break-all;
            background: #1a2332;
            transition: background 0.2s;
        }
        
        .msg-item:hover {
            background: #1e2d42;
        }
        
        .msg-time {
            color: #6a7a8f;
            font-size: 0.75em;
        }
        
        .msg-topic {
            font-weight: 700;
            color: #ff6b8a;
            font-size: 0.85em;
        }
        
        .msg-payload {
            color: #e8edf5;
            margin-top: 3px;
        }
        
        .msg-error {
            border-left-color: #ef5350;
            background: #2a1a1a;
        }
        .msg-error .msg-topic {
            color: #ef5350;
        }
        
        .msg-system {
            border-left-color: #66bb6a;
            background: #1a2a1a;
        }
        .msg-system .msg-topic {
            color: #66bb6a;
        }
        
        .placeholder {
            grid-column: 1/-1;
            text-align: center;
            padding: 40px;
            color: #6a7a8f;
            background: #1a2332;
            border-radius: 12px;
            border: 2px dashed #2a3a4f;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .temp-grid { grid-template-columns: 1fr; }
            .input-group { flex-direction: column; }
            .input-group input { width: 100%; }
            .password-wrapper { width: 100%; }
            .input-group button { width: 100%; justify-content: center; }
            .temp-value { font-size: 2.2em; }
            h1 { font-size: 1.6em; }
        }
    </style>
</head>

<body>
    <div class="container">
        
        <!-- ===== TITEL ===== -->
        <h1>🌡️ IoT <span>WSS</span> Dashboard</h1>
        
        <!-- ===== TEMPERATUR-ANZEIGE ===== -->
        <div id="temp-grid" class="temp-grid">
            <div class="placeholder">📡 Warte auf Temperaturdaten...</div>
        </div>
        
        <!-- ===== VERBINDUNG ===== -->
        <div class="card">
            <h3>🔧 Verbindung</h3>
            
            <div class="input-group">
                <input type="text" id="host" value="192.168.0.106" placeholder="Host">
                <input type="text" id="port" value="8085" placeholder="Port">
            </div>
            
            <div class="input-group">
                <input type="text" id="username" value="test_device" placeholder="Benutzername">
            </div>
            
            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Passwort" value="test_password_123">
                    <button type="button" class="password-toggle" id="togglePassword" onclick="togglePasswordVisibility()" title="Passwort anzeigen/verstecken">
                        👁️
                    </button>
                </div>
            </div>
            
            <div class="input-group">
                <button class="btn-connect" onclick="connectWSS()">🔌 Verbinden</button>
                <button class="btn-disconnect" onclick="disconnectWSS()">🔌 Trennen</button>
                <button class="btn-clear" onclick="clearMessages()">🗑️ Logs löschen</button>
            </div>
            
            <div style="font-size:0.8em;color:#6a7a8f;margin-top:8px;">
                💡 Tipp: <kbd>Strg</kbd> + <kbd>Shift</kbd> + <kbd>P</kbd> = Passwort umschalten
            </div>
        </div>
        
        <!-- ===== STATUS ===== -->
        <div class="card">
            <h3>📡 Status</h3>
            <div id="status" class="status-display status-offline">🔴 Nicht verbunden</div>
            <div id="client-id"></div>
            <div id="device-count">📱 Keine Geräte aktiv</div>
        </div>
        
        <!-- ===== LOGS ===== -->
        <div class="card messages-card">
            <h3>📨 Logs</h3>
            <div id="messages"></div>
        </div>
        
    </div>

    <!-- ============================================================
         JAVASCRIPT - LOGIK
         ============================================================ -->
    <script>
        // ============================================================
        // GLOBALE VARIABLEN
        // ============================================================
        
        let client = null;          // MQTT Client
        let devices = new Map();    // Gerätedaten
        
        // ============================================================
        // PASSWORT SICHTBARKEIT
        // ============================================================
        
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePassword');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerHTML = '🙈';
                toggleBtn.classList.add('active');
                toggleBtn.title = 'Passwort verstecken';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerHTML = '👁️';
                toggleBtn.classList.remove('active');
                toggleBtn.title = 'Passwort anzeigen';
            }
            passwordInput.focus();
        }
        
        // Tastatur-Shortcut: Strg+Shift+P
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.shiftKey && (event.key === 'P' || event.key === 'p')) {
                event.preventDefault();
                togglePasswordVisibility();
            }
        });
        
        // ============================================================
        // VERBINDUNG AUFBAUEN
        // ============================================================
        
        function connectWSS() {
            // 1. Werte aus den Eingabefeldern lesen
            const host = document.getElementById('host').value;
            const port = document.getElementById('port').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // 2. Prüfen ob Passwort eingegeben wurde
            if (!password) {
                alert('⚠️ Bitte Passwort eingeben!');
                document.getElementById('password').focus();
                return;
            }
            
            // 3. Protokoll automatisch wählen
            const protocol = port === '8084' ? 'wss://' : 'ws://';
            const wsUrl = `${protocol}${host}:${port}`;
            
            console.log(`🔗 Verbinde mit: ${wsUrl}`);
            updateStatus(`🔄 Verbinde mit ${wsUrl}...`, 'connecting');
            
            // 4. MQTT Verbindungsoptionen
            const options = {
                username: username,
                password: password,
                clientId: 'web_' + Math.random().toString(16).substr(2, 8),
                rejectUnauthorized: false,
                connectTimeout: 10000
            };
            
            // 5. MQTT Client erstellen und verbinden
            client = mqtt.connect(wsUrl, options);
            
            // 6. Event: Verbindung erfolgreich
            client.on('connect', () => {
                updateStatus('✅ Verbunden!', 'online');
                document.getElementById('client-id').innerHTML = `🆔 Client: ${options.clientId}`;
                
                // Topics abonnieren
                client.subscribe('sensor/temperatur');
                client.subscribe('status/+/online');
                client.subscribe('test/#');
                
                addMessage('system', '✅ Verbunden und abonniert', 'system');
            });
            
            // 7. Event: Nachricht empfangen
            client.on('message', (topic, message) => {
                const payload = message.toString();
                addMessage(topic, payload);
                
                try {
                    const data = JSON.parse(payload);
                    if (data.temp !== undefined && data.device_id) {
                        updateDeviceDisplay(data);
                    }
                } catch(e) {}
            });
            
            // 8. Event: Fehler
            client.on('error', (err) => {
                updateStatus(`❌ Fehler: ${err.message}`, 'offline');
                addMessage('error', err.message, 'error');
                console.error('MQTT Fehler:', err);
            });
            
            // 9. Event: Verbindung geschlossen
            client.on('close', () => {
                updateStatus('⚠️ Verbindung geschlossen', 'offline');
            });
        }
        
        // ============================================================
        // VERBINDUNG TRENNEN
        // ============================================================
        
        function disconnectWSS() {
            if (client) {
                client.end();
                client = null;
                updateStatus('🔌 Getrennt', 'offline');
                addMessage('system', '🔌 Manuell getrennt', 'system');
                devices.clear();
                renderDevices();
            }
        }
        
        // ============================================================
        // GERÄTE-ANZEIGE AKTUALISIEREN
        // ============================================================
        
        function updateDeviceDisplay(data) {
            const deviceId = data.device_id;
            const temp = data.temp;
            const rssi = data.rssi || 'N/A';
            const uptime = data.uptime || 0;
            
            devices.set(deviceId, {
                temp: temp,
                rssi: rssi,
                uptime: uptime,
                lastUpdate: new Date()
            });
            
            renderDevices();
        }
        
        // ============================================================
        // DASHBOARD RENDERN
        // ============================================================
        
        function renderDevices() {
            const grid = document.getElementById('temp-grid');
            grid.innerHTML = '';
            
            if (devices.size === 0) {
                grid.innerHTML = `<div class="placeholder">📡 Warte auf Temperaturdaten...</div>`;
                document.getElementById('device-count').innerHTML = '📱 Keine Geräte aktiv';
                return;
            }
            
            const sorted = Array.from(devices.entries())
                .sort((a, b) => b[1].temp - a[1].temp);
            
            sorted.forEach(([id, data]) => {
                const temp = data.temp;
                const rssi = data.rssi;
                const uptime = data.uptime;
                const lastUpdate = data.lastUpdate;
                
                let colorClass = 'temp-normal';
                let borderClass = 'border-normal';
                let icon = '✅';
                let statusText = 'Normal';
                
                if (temp > 40) {
                    colorClass = 'temp-hot';
                    borderClass = 'border-hot';
                    icon = '🔥';
                    statusText = 'KRITISCH!';
                } else if (temp > 30) {
                    colorClass = 'temp-warm';
                    borderClass = 'border-warm';
                    icon = '⚠️';
                    statusText = 'Warm';
                } else if (temp < 0) {
                    colorClass = 'temp-cold';
                    borderClass = 'border-cold';
                    icon = '❄️';
                    statusText = 'Gefrierpunkt';
                }
                
                const card = document.createElement('div');
                card.className = `temp-card ${borderClass}`;
                card.innerHTML = `
                    <div class="temp-card-header">
                        <span class="temp-card-device">${icon} ${id}</span>
                        <span class="temp-card-rssi">📶 ${rssi}dBm</span>
                    </div>
                    <div class="temp-value ${colorClass}">
                        ${temp.toFixed(1)}<span class="temp-unit">°C</span>
                    </div>
                    <div style="text-align:center;font-size:0.8em;color:#8a9bb5;margin-bottom:5px;">
                        ${statusText}
                    </div>
                    <div class="temp-card-footer">
                        <span>⏱️ ${Math.floor(uptime/60)}min ${Math.floor(uptime%60)}s</span>
                        <span>🔄 ${lastUpdate.toLocaleTimeString()}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            document.getElementById('device-count').innerHTML = `📱 ${devices.size} Gerät(e) aktiv`;
        }
        
        // ============================================================
        // NACHRICHTEN
        // ============================================================
        
        function addMessage(topic, message, type) {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-item';
            if (type === 'system') msgDiv.classList.add('msg-system');
            if (type === 'error') msgDiv.classList.add('msg-error');
            
            const time = new Date().toLocaleTimeString();
            
            msgDiv.innerHTML = `
                <div class="msg-time">${time}</div>
                <div class="msg-topic">${escapeHtml(topic)}</div>
                <div class="msg-payload">${escapeHtml(message.substring(0, 500))}</div>
            `;
            
            messagesDiv.insertBefore(msgDiv, messagesDiv.firstChild);
            
            while (messagesDiv.children.length > 200) {
                messagesDiv.removeChild(messagesDiv.lastChild);
            }
        }
        
        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
        }
        
        // ============================================================
        // STATUS
        // ============================================================
        
        function updateStatus(message, state) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            statusDiv.className = 'status-display';
            if (state === 'online') statusDiv.classList.add('status-online');
            else if (state === 'offline') statusDiv.classList.add('status-offline');
            else if (state === 'connecting') statusDiv.classList.add('status-connecting');
        }
        
        // ============================================================
        // HTML ESCAPE (Sicherheit gegen XSS)
        // ============================================================
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
