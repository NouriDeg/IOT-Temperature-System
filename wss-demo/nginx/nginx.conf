# ============================================
# Nginx Reverse Proxy für WSS (Port 443)
# ============================================

events {
    worker_connections 1024;
}

http {
    # MQTT über WebSocket (WSS) auf Port 443
    server {
        listen 443 ssl;
        server_name iot.local;
        
        # SSL Zertifikate (gleiche wie für Mosquitto)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_trusted_certificate /etc/nginx/certs/ca.crt;  
        
        # SSL Konfiguration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # WebSocket Proxy für MQTT
        location /mqtt {
            proxy_pass http://mqtt_broker:8084;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Timeout für WebSocket
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        
        # Dashboard (optional)
        location / {
            proxy_pass http://api_backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
    
    # HTTP zu HTTPS umleiten
    server {
        listen 80;
        server_name iot.local;
        return 301 https://$server_name$request_uri;
    }
}