http {
    server {
        listen 80;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        location /api/ {
            proxy_pass http://api_backend:5000/api/;
            proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
        }
    }
}

events {
    worker_connections 1024;
}
