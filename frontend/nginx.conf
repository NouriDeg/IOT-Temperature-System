# ============================================================================
# NGINX SERVER KONFIGURATION - IoT FRONTEND
# ============================================================================
# 
# Zweck: Static Web Server für das IoT Dashboard
# 
# Diese Konfiguration definiert:
# - Auslieferung statischer Dateien (HTML, CSS, JS)
# - Gzip Komprimierung für kleinere Dateien
# - Caching für bessere Performance
# - SPA Routing (Single Page Application)
# - API Proxy zur Vermeidung von CORS Problemen
# 
# Autor: Nouri deg. 
# IoT Temperature Monitoring System
# Datum: 29.04.2026
# Version: 2.0
# ============================================================================

# ============================================================================
# SERVER BLOCK
# ============================================================================
# Definiert einen virtuellen Server, der auf eingehende HTTP-Anfragen reagiert
server {
    
    # ========================================================================
    # GRUNDKONFIGURATION
    # ========================================================================
    
    # Hört auf Port 80 (Standard HTTP Port)
    # 0.0.0.0 bedeutet: Akzeptiere Verbindungen von allen Netzwerkschnittstellen
    listen 80;
    
    # server_name _; (Unterstrich) bedeutet: 
    # Akzeptiere alle Domain-Namen (Default Server)
    # Für spezifische Domains würde hier z.B. "iot.local" stehen
    server_name _;
    
    # Root-Verzeichnis für statische Dateien
    # Alle Dateien in diesem Ordner werden ausgeliefert
    # /usr/share/nginx/html ist das Standard-Verzeichnis im Nginx Container
    root /usr/share/nginx/html;
    
    # Standard-Datei (Index) bei Verzeichnisaufruf
    # Wenn ein Benutzer die Haupt-URL aufruft, wird index.html geladen
    index index.html;
    
    # ========================================================================
    # GZIP KOMPRIMIERUNG
    # ========================================================================
    # Reduziert die Dateigröße für schnellere Ladezeiten
    
    # Aktiviert Gzip Komprimierung
    gzip on;
    
    # Gzip Level (1-9, 1 = schnellste, 9 = beste Komprimierung)
    # Standard ist 6, ist ein guter Kompromiss
    # gzip_comp_level 6;  (optional, falls angepasst werden soll)
    
    # Minimale Dateigröße für Komprimierung (Standard: 20 Bytes)
    # gzip_min_length 1000;  (optional)
    
    # Dateitypen, die komprimiert werden sollen
    # text/css: CSS Stylesheets
    # text/javascript: JavaScript Dateien
    # application/javascript: Alternative MIME-Type für JS
    # Weitere sinnvolle Typen: text/html, application/json, text/xml
    gzip_types text/css text/javascript application/javascript;
    
    # Vary Header setzen (für Proxy-Caches)
    # Sagt Caches, dass die Antwort je nach Accept-Encoding variieren kann
    # gzip_vary on;  (optional, aber empfohlen)
    
    # ========================================================================
    # STATISCHE DATEIEN CACHING
    # ========================================================================
    # Verbessert die Ladezeit für wiederkehrende Besuche
    
    # location ~* ... bedeutet: Fallunterscheidung für Datei-Endungen
    # ~*: Groß-/Kleinschreibung wird ignoriert (case-insensitive regex)
    # (js|css|png|jpg|jpeg|gif|ico): Dateiendungen, die gematched werden sollen
    # $: Ende der Zeile
    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        # # Cache-Control Header setzen
        # - "public": Darf von allen Caches (Browser, Proxy) gespeichert werden
        # - "immutable": Die Datei ändert sich nie (z.B. mit Hash im Namen)
        # ACHTUNG: Nur verwenden wenn Dateien mit Hash im Namen (z.B. style.abc123.css)
        add_header Cache-Control "public, immutable";
        
        # Ablaufzeit des Caches: 1 Jahr (1y = 365 Tage)
        # Der Browser speichert die Datei für 1 Jahr, bevor er sie erneut anfragt
        expires 1y;
        
        # Logging reduzieren (optional, weniger Log-Einträge für statische Dateien)
        # access_log off;
        
        # Zusätzlicher Header für bessere Kompatibilität
        # add_header Vary "Accept-Encoding";
    }
    
    # ========================================================================
    # SPA ROUTING (Single Page Application)
    # ========================================================================
    # Ermöglicht client-seitiges Routing ohne 404-Fehler
    
    # location /: Fängt alle Anfragen, die nicht von anderen location Blöcken erfasst werden
    location / {
        # try_files: Versucht Dateien in folgender Reihenfolge zu finden:
        # 1. $uri: Die angefragte URL als Dateipfad (z.B. /about.html)
        # 2. $uri/: Der Pfad als Verzeichnis (z.B. /about/index.html)
        # 3. /index.html: Fallback auf index.html (wichtig für SPA Routing!)
        # 
        # Beispiel für SPA Routing:
        # Benutzer ruft /dashboard auf -> Keine dashboard.html Datei vorhanden
        # -> try_files leitet auf index.html um
        # -> JavaScript übernimmt das Routing und zeigt die richtige Komponente an
        try_files $uri $uri/ /index.html;
        
        # Optimierung: Verhindert dass Nginx nach index.html in Unterordnern sucht
        # index index.html;
        
        # Cache-Control für HTML Datei (kurzer Cache, damit Updates sofort sichtbar sind)
        # add_header Cache-Control "no-cache, must-revalidate";
    }
    
    # ========================================================================
    # API PROXY (CORS VERMEIDUNG)
    # ========================================================================
    # Leitet API Anfragen an das Backend weiter
    # Vermeidet Cross-Origin Resource Sharing (CORS) Probleme
    
    # location /api/: Fängt alle Anfragen, die mit /api/ beginnen
    # Wichtig: Das letzte Slash ist entscheidend für korrekte Weiterleitung
    location /api/ {
        
        # proxy_pass: Leitet die Anfrage an das Backend weiter
        # http://api_backend:5000/ ist die interne Docker Adresse
        # api_backend = Container-Name (Docker DNS)
        # 5000 = Port des Flask Backends
        # Das letzte Slash (/) entfernt das /api/ Präfix beim Weiterleiten
        # 
        # Beispiel:
        # Anfrage: /api/latest
        # Wird weitergeleitet zu: http://api_backend:5000/latest
        proxy_pass http://api_backend:5000/api/;
        
        # ====================================================================
        # PROXY HEADER (Wichtig für korrekte Weiterleitung)
        # ====================================================================
        
        # Host Header: Setzt den ursprünglichen Hostnamen
        # $host enthält den Host aus der ursprünglichen Anfrage
        # Dadurch weiß das Backend, von welchem Client die Anfrage kam
        proxy_set_header Host $host;
        
        # X-Real-IP Header: Setzt die echte Client IP
        # $remote_addr enthält die IP des Clients (nicht des Proxies)
        # Wichtig für Logging und Authentifizierung
        proxy_set_header X-Real-IP $remote_addr;
        
        # X-Forwarded-For Header: Kette aller beteiligten IPs
        # Nützlich wenn mehrere Proxies durchlaufen werden
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # X-Forwarded-Proto Header: Ursprüngliches Protokoll (HTTP/HTTPS)
        # Wichtig wenn HTTPS hinter einem Proxy terminiert wird
        # proxy_set_header X-Forwarded-Proto $scheme;
        
        # ====================================================================
        # PROXY TIMEOUTS (Für lange Anfragen)
        # ====================================================================
        
        # Timeout für Verbindungsaufbau (Standard: 60s)
        # proxy_connect_timeout 60s;
        
        # Timeout für Datenübertragung (Standard: 60s)
        # proxy_send_timeout 60s;
        # proxy_read_timeout 60s;
        
        # ====================================================================
        # PROXY BUFFER (Für große Antworten)
        # ====================================================================
        
        # Buffer-Größe für Proxy-Antworten (Standard: 4k/8k)
        # proxy_buffer_size 4k;
        # proxy_buffers 8 4k;
        # proxy_busy_buffers_size 8k;
    }
    
    # ========================================================================
    # OPTIONALE ERWEITERUNGEN
    # ========================================================================
    
    # Sicherheits-Header (empfohlen für Produktion)
    # add_header X-Content-Type-Options "nosniff";
    # add_header X-Frame-Options "SAMEORIGIN";
    # add_header X-XSS-Protection "1; mode=block";
    
    # Fehlerseiten (optional)
    # error_page 404 /404.html;
    # error_page 500 502 503 504 /50x.html;
    
    # access_log: Loggt alle Anfragen (für Debugging)
    # access_log /var/log/nginx/access.log;
    # error_log /var/log/nginx/error.log;
}

# ============================================================================
# ZUSÄTZLICHE KONFIGURATION (Optional)
