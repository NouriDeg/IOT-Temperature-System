# =============================================================================
# NGINX KONFIGURATION - FRONTEND SERVER
# =============================================================================
# Dieser Nginx Server dient als Frontend-Webserver für das IoT Dashboard.
# 
# Aufgaben:
# 1. Auslieferung der statischen HTML/CSS/JS Dateien (Frontend)
# 2. Weiterleitung (Proxy) von API Anfragen an das Flask Backend
# 3. Vermeidung von CORS Problemen (gleicher Ursprung)
# 
# Verwendung:
# - Port 80 (HTTP) für einfachen Zugriff im lokalen Netzwerk
# - Statische Dateien aus /usr/share/nginx/html
# - API Anfragen werden an Backend weitergeleitet
# =============================================================================

http {
    # =========================================================================
    # HTTP SERVER (Port 80)
    # =========================================================================
    # Dieser Server block hört auf Port 80 (Standard HTTP)
    server {
        # Hört auf Port 80 (Standard HTTP, kein TLS)
        # 80 ist der Standard-HTTP-Port, muss nicht in der URL angegeben werden
        listen 80;
        
        # =====================================================================
        # STATISCHE DATEIEN (Frontend)
        # =====================================================================
        # Verarbeitet Anfragen an die Haupt-URL (z.B. http://192.168.0.105:8080/)
        location / {
            # root: Verzeichnis, in dem die statischen Dateien liegen
            # /usr/share/nginx/html ist das Standard-Verzeichnis im Nginx Container
            root /usr/share/nginx/html;
            
            # index: Standard-Datei, die bei Verzeichnisaufruf geliefert wird
            # Wenn ein Benutzer die Haupt-URL aufruft, wird index.html geladen
            index index.html;
        }
        
        # =====================================================================
        # API PROXY (Weiterleitung an Backend)
        # =====================================================================
        # Verarbeitet Anfragen, die mit /api/ beginnen
        # Z.B. http://192.168.0.105:8080/api/latest
        location /api/ {
            # proxy_pass: Leitet die Anfrage an das Backend weiter
            # api_backend: Der Hostname des Backend Containers (Docker DNS)
            # 5000: Der Port des Flask Backends
            # Das /api/ am Ende sorgt dafür, dass der Pfad erhalten bleibt
            proxy_pass http://api_backend:5000/api/;
            
            # proxy_set_header: Setzt HTTP Header für die Weiterleitung
            # Host: Der ursprüngliche Hostname wird weitergegeben
            # Dadurch weiß das Backend, von welchem Client die Anfrage kam
            proxy_set_header Host $host;
            
            # Weitere wichtige Header (sollten für ordentliches Proxying gesetzt werden)
            # Real-IP: Die echte IP des Clients
            # proxy_set_header X-Real-IP $remote_addr;
            
            # Forwarded-For: Alle beteiligten IPs (bei mehreren Proxies)
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Forwarded-Proto: Ursprüngliches Protokoll (HTTP/HTTPS)
            # proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# =============================================================================
# GLOBALE NGINX EINSTELLUNGEN
# =============================================================================
# Diese Einstellungen gelten für den gesamten Nginx Server
# (müssen außerhalb des http-Blocks stehen)

# =============================================================================
# EVENT VERARBEITUNG
# =============================================================================
# Konfiguriert wie Nginx mit Verbindungen umgeht
events {
    # worker_connections: Maximale Anzahl gleichzeitiger Verbindungen pro Worker
    # 1024 ist der Standardwert und ausreichend für die meisten Anwendungen
    # Ein Nginx mit 1 Worker kann also 1024 gleichzeitige Verbindungen handhaben
    worker_connections 1024;
    
    # Optional: event processing model (meist nicht nötig)
    # use epoll;  # Linux: epoll ist der beste Event-Handler
}